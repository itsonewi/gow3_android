name: SpartanPort
options:
  bundleIdPrefix: com.onewi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ENABLE_MODULES: YES
    CLANG_CXX_LANGUAGE_STANDARD: "c++20"
    GCC_C_LANGUAGE_STANDARD: "gnu11"
    CLANG_CXX_LIBRARY: "libc++"

targets:
  # ---------------------------------------------------------------------------
  # The iOS runtime: stock loader + HLE + FEX glue + platform shims.
  # ---------------------------------------------------------------------------
  SpartanRuntime:
    type: library.static
    platform: iOS
    sources:
      - path: Runtime
      - path: ../src/runtime.c
        compilerFlags: "-include $(SRCROOT)/Runtime/platform/sp_compat.h"
      - path: ../src/runtime_kernel.c
        compilerFlags: "-include $(SRCROOT)/Runtime/platform/sp_compat.h"
      - path: ../src/runtime_memory.c
        compilerFlags: "-include $(SRCROOT)/Runtime/platform/sp_compat.h"
      - path: ../src/runtime_mutex.c
        compilerFlags: "-include $(SRCROOT)/Runtime/platform/sp_compat.h"
      - path: ../src/runtime_rwlock.c
        compilerFlags: "-include $(SRCROOT)/Runtime/platform/sp_compat.h"
      - path: ../src/runtime_sema.c
        compilerFlags: "-include $(SRCROOT)/Runtime/platform/sp_compat.h"
      - path: ../src/runtime_thread.c
        compilerFlags: "-include $(SRCROOT)/Runtime/platform/sp_compat.h"
      - path: ../src/runtime_time.c
        compilerFlags: "-include $(SRCROOT)/Runtime/platform/sp_compat.h"
      - path: ../src/runtime_file.c
        compilerFlags: "-include $(SRCROOT)/Runtime/platform/sp_compat.h"
      - path: ../src/runtime_services.c
        compilerFlags: "-include $(SRCROOT)/Runtime/platform/sp_compat.h"
      - path: ../src/runtime_savedata.c
        compilerFlags: "-include $(SRCROOT)/Runtime/platform/sp_compat.h"
      - path: ../src/runtime_content.c
        compilerFlags: "-include $(SRCROOT)/Runtime/platform/sp_compat.h"
      - path: ../src/runtime_rtc.c
        compilerFlags: "-include $(SRCROOT)/Runtime/platform/sp_compat.h"
    settings:
      base:
        PRODUCT_NAME: SpartanRuntime
        # sp_compat.h is applied per source file: a target-wide -include also
        # reaches host_call_arm64_ios.S, whose assembler then tries to parse
        # <unistd.h> and fails.
        OTHER_CFLAGS: "$(inherited)"
        OTHER_CPLUSPLUSFLAGS: "$(inherited)"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Runtime/include"
          - "$(SRCROOT)/Runtime/platform"
          - "$(SRCROOT)/../src"
          - "$(SRCROOT)/.."
          - "$(SRCROOT)/../third_party/FEX/FEXCore/include"
          - "$(SRCROOT)/../third_party/FEX/FEXCore/Source/Interface/Config"
          - "$(SRCROOT)/../third_party/FEX/Source"
          - "$(SRCROOT)/../third_party/FEX/build-ios/generated"
          - "$(SRCROOT)/../third_party/FEX/build-ios/include"
          - "$(SRCROOT)/../third_party/FEX/External/fmt/include"
          - "$(SRCROOT)/../third_party/FEX/build-ios/External/fmt/include"
          - "$(SRCROOT)/../third_party/FEX/External/range-v3/include"
          - "$(SRCROOT)/../third_party/FEX/External/unordered_dense/include"
          - "$(SRCROOT)/../third_party/FEX/External/xxhash"
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "SPARTAN_IOS=1"

  # ---------------------------------------------------------------------------
  # The app: SwiftUI launcher, JIT/memory layer, game import, Play.
  #
  # The guest's user window starts at 64 GiB (PS4 USER_MIN, see
  # src/runtime_memory.c), so the process needs the extended-virtual-addressing
  # entitlement (512 GiB map) and the app's own image can stay at the normal
  # 0x100000000. The memory card reports both facts at run time.
  # ---------------------------------------------------------------------------
  SpartanPort:
    type: application
    platform: iOS
    sources:
      - path: SpartanPort
        excludes:
          - "Resources/Info.plist"
          - "Resources/SpartanPort.entitlements"
    dependencies:
      - target: SpartanRuntime
      - target: SpartanPortMemoryHost
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onewi.spartanport
        PRODUCT_NAME: SpartanPort
        INFOPLIST_FILE: SpartanPort/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: SpartanPort/Resources/SpartanPort.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: SpartanPort/Native/SpartanPort-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_BITCODE: NO
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Runtime/include"
          - "$(SRCROOT)/Shared"
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "SPARTANPORT_RUNTIME=1"
        OTHER_LDFLAGS: >-
          $(inherited) -lFEXCore -lFEXCore_Base -lJemallocLibs
          -lfmt -lcephes_128bit -lsoftfloat_3e -lxxhash -lc++ -lz
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/../third_party/FEX/build-ios/FEXCore/Source"
          - "$(SRCROOT)/../third_party/FEX/build-ios/External/fmt"
          - "$(SRCROOT)/../third_party/FEX/build-ios/External/cephes"
          - "$(SRCROOT)/../third_party/FEX/build-ios/External/SoftFloat-3e"
          - "$(SRCROOT)/../third_party/FEX/build-ios/External/xxhash/cmake_unofficial"
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    scheme:
      gatherCoverageData: false
      commandLineArguments:
        "-SPDebug": false

  # ---------------------------------------------------------------------------
  # The GPU variant: same app, linked against shadPS4 + MoltenVK.
  #
  # Build it only after ios/scripts/build-gpu-ios.sh produced
  # out/gpu-ios/libspartanportgpu-all.a (the GPU library and every static
  # dependency combined with libtool). The weak stubs in Runtime/gpu are then
  # overridden by the real spartanportgpu_* symbols, and Play passes
  # cpu_only = 0 so the loader creates the Metal surface and the Vulkan device.
  # ---------------------------------------------------------------------------
  SpartanPortGPU:
    type: application
    platform: iOS
    sources:
      - path: SpartanPort
        excludes:
          - "Resources/Info.plist"
          - "Resources/SpartanPort.entitlements"
      # SDL3 is inside libspartanportgpu-all.a; the GPU app can therefore use the
      # real pad and audio HLE instead of the CPU app's stubs.
      - path: ../src/runtime_pad.c
        compilerFlags: "-include $(SRCROOT)/Runtime/platform/sp_compat.h"
      - path: ../src/runtime_audio.c
        compilerFlags: "-include $(SRCROOT)/Runtime/platform/sp_compat.h"
      - path: ../src/runtime_ajm.c
        compilerFlags: "-include $(SRCROOT)/Runtime/platform/sp_compat.h"
      # ATRAC9 (the game's audio codec) is a small pure-C decoder; MP3 stays on
      # the FFmpeg-less weak stub.
      - path: ../third_party/LibAtrac9/C/src
    dependencies:
      - target: SpartanRuntime
      - target: SpartanPortMemoryHostGPU
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onewi.spartanport.gpu
        PRODUCT_NAME: SpartanPortGPU
        INFOPLIST_FILE: SpartanPort/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: SpartanPort/Resources/SpartanPort.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: SpartanPort/Native/SpartanPort-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_BITCODE: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SPARTANPORT_GPU"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Runtime/include"
          - "$(SRCROOT)/Runtime/platform"
          - "$(SRCROOT)/Shared"
          - "$(SRCROOT)/../src"
          - "$(SRCROOT)/.."
          - "$(SRCROOT)/.build/ios/include"
          - "$(SRCROOT)/../out/gpu-ios/include"
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "SPARTANPORT_RUNTIME=1"
          - "SPARTANPORT_GPU=1"
        OTHER_LDFLAGS: >-
          $(inherited) -lspartanportgpu-all -lSpartanRuntime
          -lFEXCore -lFEXCore_Base -lJemallocLibs
          -lfmt -lcephes_128bit -lsoftfloat_3e -lxxhash -lc++ -lz
          -Wl,-framework,Metal -Wl,-framework,QuartzCore -Wl,-framework,UIKit
          -Wl,-framework,Foundation -Wl,-framework,CoreGraphics
          -Wl,-framework,IOSurface -Wl,-framework,CoreVideo
          -Wl,-framework,AVFoundation -Wl,-framework,AudioToolbox
          -Wl,-framework,CoreAudio -Wl,-framework,GameController
          -Wl,-framework,CoreHaptics -Wl,-framework,CoreMotion
          -Wl,-framework,CoreBluetooth -Wl,-framework,CoreMedia
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/../out/gpu-ios"
          - "$(BUILT_PRODUCTS_DIR)"
          - "$(SRCROOT)/../third_party/FEX/build-ios/FEXCore/Source"
          - "$(SRCROOT)/../third_party/FEX/build-ios/External/fmt"
          - "$(SRCROOT)/../third_party/FEX/build-ios/External/cephes"
          - "$(SRCROOT)/../third_party/FEX/build-ios/External/SoftFloat-3e"
          - "$(SRCROOT)/../third_party/FEX/build-ios/External/xxhash/cmake_unofficial"
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    scheme:
      gatherCoverageData: false

  # ---------------------------------------------------------------------------
  # Memory+: the extension on com.apple.ar.viewer that iOS 27's jetsam table
  # leaves without a memory limit. Same experiment as Madeira's
  # MadeiraMemoryHost: it creates memory objects for the app on request.
  # ---------------------------------------------------------------------------
  SpartanPortMemoryHost:
    type: app-extension
    platform: iOS
    sources:
      - path: SpartanPortMemoryHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onewi.spartanport.memoryhost
        PRODUCT_NAME: SpartanPortMemoryHost
        INFOPLIST_FILE: SpartanPortMemoryHost/Info.plist
        CODE_SIGN_ENTITLEMENTS: SpartanPortMemoryHost/MemoryHost.entitlements
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CLANG_ENABLE_OBJC_ARC: YES
        OTHER_LDFLAGS: "$(inherited)"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Shared"

  # The GPU app embeds the same extension under its own prefix: Xcode requires
  # an app extension's bundle id to be prefixed by its host app's bundle id.
  # The product name stays SpartanPortMemoryHost so MemoryDonor finds it by
  # path; only the bundle id differs.
  SpartanPortMemoryHostGPU:
    type: app-extension
    platform: iOS
    sources:
      - path: SpartanPortMemoryHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onewi.spartanport.gpu.memoryhost
        PRODUCT_NAME: SpartanPortMemoryHost
        INFOPLIST_FILE: SpartanPortMemoryHost/Info.plist
        CODE_SIGN_ENTITLEMENTS: SpartanPortMemoryHost/MemoryHost.entitlements
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CLANG_ENABLE_OBJC_ARC: YES
        OTHER_LDFLAGS: "$(inherited)"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Shared"
