name: SpartanPort
options:
  bundleIdPrefix: com.onewi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ENABLE_MODULES: YES

targets:
  SpartanPort:
    type: application
    platform: iOS
    sources:
      - path: SpartanPort
        excludes:
          - "Resources/Info.plist"
          - "Resources/SpartanPort.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onewi.spartanport
        PRODUCT_NAME: SpartanPort
        INFOPLIST_FILE: SpartanPort/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: SpartanPort/Resources/SpartanPort.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: SpartanPort/Native/SpartanPort-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_BITCODE: NO
        CLANG_CXX_LANGUAGE_STANDARD: "c++20"
        OTHER_LDFLAGS: "$(inherited) -lc++"
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    scheme:
      gatherCoverageData: false
      commandLineArguments:
        "-SPDebug": false
