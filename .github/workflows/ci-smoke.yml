name: ci-smoke

on:
  push:
    branches: [ci-test]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - run: uname -a
      - run: echo linux-ok
  mac:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - run: sw_vers
      - run: echo mac-ok
