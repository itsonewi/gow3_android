name: Build iOS IPA

on:
  push:
    branches: [arm, main, ios]
    paths:
      - "ios/**"
      - "src/**"
      - "cpu/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "src/**"
      - "cpu/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: iOS tree checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pyyaml
      - name: Structural checks
        run: python -m unittest discover -s ios/tests -v

  build:
    name: Build unsigned IPA (${{ matrix.os }})
    # GitHub-hosted macOS capacity is shared across labels; run both an ARM and
    # an Intel image so whichever pool frees up first produces the IPA.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: LibAtrac9 submodule
        # The GPU target lists third_party/LibAtrac9/C/src; XcodeGen validates
        # every target's source directories even when only the CPU app builds.
        run: git submodule update --init --depth 1 third_party/LibAtrac9

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p
          uname -m
          cmake --version
          ninja --version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          if ! command -v ninja >/dev/null 2>&1; then
            brew install ninja
          fi
          xcodegen --version
          ninja --version

      - name: Fetch FEX (Madeira's iOS fork)
        run: bash ios/scripts/fetch-fex.sh
        env:
          FEX_REF: ios-port-2607

      - name: Cache FEX iOS libraries
        uses: actions/cache@v4
        with:
          path: third_party/FEX/build-ios
          key: fex-ios-${{ runner.os }}-${{ hashFiles('third_party/FEX/FEXCore/include/FEXCore/Core/HostFeatures.h') }}-v1

      - name: Build FEXCore for iOS
        run: bash ios/scripts/build-fex-ios.sh
        env:
          JOBS: 4

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build app
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project SpartanPort.xcodeproj \
            -scheme SpartanPort \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build | tee build.log

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="ios/build/Build/Products/Release-iphoneos/SpartanPort.app"
          test -d "$APP"
          # The memory host extension must survive in PlugIns; without it the
          # app still runs, only the Memory+ donation experiment is missing.
          ls -la "$APP/PlugIns" || true
          rm -rf dist
          mkdir -p dist/Payload dist/signing
          cp -R "$APP" dist/Payload/
          cp ios/SpartanPort/Resources/SpartanPort.entitlements dist/signing/
          cat > dist/signing/README.txt <<'EOF'
          SpartanPort iOS - unsigned build

          The IPA in this artifact is unsigned. Install it with the sideloading
          tool you normally use (SideStore, AltStore, Sideloadly, ESign, ...).

          For the runtime to work, that tool must sign the app with these
          entitlements (dist/signing/SpartanPort.entitlements):
            com.apple.developer.kernel.increased-memory-limit     (Memory+)
            com.apple.developer.kernel.extended-virtual-addressing (512 GB map)
            get-task-allow                                        (StikDebug JIT)

          Memory+ is not a switch: a profile that drops the two kernel
          entitlements makes the guest's mappings fail (the guest's user
          window starts at 64 GiB, above the 63 GiB default map), and the app's
          Memory card shows that at run time.
          EOF
          cd dist
          zip -qry SpartanPort-unsigned.ipa Payload
          ls -lh SpartanPort-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SpartanPort-ipa-${{ matrix.os }}
          path: |
            dist/SpartanPort-unsigned.ipa
            dist/signing/SpartanPort.entitlements
            dist/signing/README.txt
          if-no-files-found: error

      - name: Upload dSYM
        uses: actions/upload-artifact@v4
        with:
          name: SpartanPort-dsym-${{ matrix.os }}
          path: ios/build/Build/Products/Release-iphoneos/*.dSYM
          if-no-files-found: ignore

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.os }}
          path: ios/build.log
          if-no-files-found: ignore
